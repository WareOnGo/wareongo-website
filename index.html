
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="WareOnGo" />
    <!-- title / description / og tags injected per-page via PageHead (react-helmet-async) -->
    <!-- Match the local variable font in fonts.css so this request is reused. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/montserrat-v31-normal-latin.woff2"
      crossorigin
    />
    <link rel="preload" as="image" href="/logo_transparent.webp" />
    <!-- Google tag is initialized by PageHead on production hostnames only. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
